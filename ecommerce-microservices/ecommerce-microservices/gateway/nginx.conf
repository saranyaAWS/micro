events {}

http {
  server {
    listen 80;

    location /cart/ {
      proxy_pass http://cart-service:3001/;
      proxy_set_header Host $host;
    }

    location /order/ {
      proxy_pass http://order-service:3002/;
      proxy_set_header Host $host;
    }

    location /payment/ {
      proxy_pass http://payment-service:3003/;
      proxy_set_header Host $host;
    }

    location /escalation/ {
      proxy_pass http://escalation-service:3004/;
      proxy_set_header Host $host;
    }

    # Real-time dashboard + socket.io traffic
    location /socket.io/ {
      proxy_pass http://escalation-service:3004/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass http://escalation-service:3004/;
      proxy_set_header Host $host;
    }
  }
}
